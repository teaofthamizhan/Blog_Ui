<div class="toast-container">
    <div *ngFor="let toast of toasts" class="toast-item" [ngClass]="'toast-' + toast.type" (click)="remove(toast.id)">
        <div class="toast-icon">
            <span *ngIf="toast.type === 'success'">✅</span>
            <span *ngIf="toast.type === 'error'">❌</span>
            <span *ngIf="toast.type === 'info'">ℹ️</span>
        </div>
        <div class="toast-message">
            {{ toast.message }}
        </div>
        <button class="toast-close" (click)="remove(toast.id); $event.stopPropagation()">&times;</button>
    </div>
</div>
