<div class="products-page">
  <!-- Page Header -->
  <section class="page-header">
    <h1>Our Complete Tea Sanctuary</h1>
  </section>

  <!-- Filter Section -->
  <section class="filter-section">
    <div class="filter-container">
      <h3>Filter by Category</h3>
      <div class="filter-buttons">
        <button *ngFor="let category of categories" [class.active]="selectedCategory === category"
          (click)="filterByCategory(category)" class="filter-btn">
          {{ category | titlecase }}
        </button>
      </div>
    </div>
  </section>

  <!-- Products Grid -->
  <section class="products-grid-section">
    <div class="products-grid">
      <app-product-card *ngFor="let tea of filteredTeas" [tea]="tea"></app-product-card>
    </div>

    <div *ngIf="filteredTeas.length === 0" class="no-products">
      <img src="images/empty-state.png" alt="No teas found" class="empty-state-img">
      <p>No teas found in this category. Please try another filter.</p>
    </div>
  </section>
</div>
